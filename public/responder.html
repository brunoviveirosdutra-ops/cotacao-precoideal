<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Responder Cotação</title>


<style>

body {

    font-family: Arial, sans-serif;

    background:#f5f5f5;

    margin:0;

    padding:20px;

}


.container {

    max-width:900px;

    margin:auto;

    background:white;

    padding:25px;

    border-radius:10px;

    box-shadow:0 0 10px #ccc;

}


h1 {

    text-align:center;

    color:#333;

}


.info {

    background:#eee;

    padding:15px;

    border-radius:8px;

    margin-bottom:20px;

}


table {

    width:100%;

    border-collapse:collapse;

}


th {

    background:#222;

    color:white;

    padding:10px;

}


td {

    padding:10px;

    border-bottom:1px solid #ddd;

}


input {

    width:120px;

    padding:8px;

}


textarea {

    width:100%;

    height:80px;

    padding:10px;

}


button {

    width:100%;

    margin-top:20px;

    padding:15px;

    background:#198754;

    color:white;

    border:none;

    border-radius:8px;

    font-size:18px;

    cursor:pointer;

}


button:hover {

    background:#146c43;

}


</style>

</head>


<body>


<div class="container">


<h1>Responder Cotação</h1>


<div id="info" class="info">

Carregando cotação...

</div>



<table>


<thead>

<tr>

<th>Produto</th>

<th>Quantidade</th>

<th>Preço</th>

</tr>

</thead>


<tbody id="produtos">

</tbody>


</table>



<h3>Observação</h3>


<textarea id="observacao"
placeholder="Digite alguma informação...">
</textarea>



<button onclick="enviarResposta()">

Enviar Cotação

</button>



<div id="mensagem"></div>


</div>



<script>


const params = new URLSearchParams(window.location.search);


const token = params.get("token");


let produtos = [];



async function carregarCotacao(){


    if(!token){

        document.getElementById("info").innerHTML =
        "Token não informado.";

        return;

    }



    const resposta = await fetch(
        `/api/public/quotation/${token}`
    );


    const dados = await resposta.json();



    if(!dados.quotation){

        document.getElementById("info").innerHTML =
        "Cotação não encontrada.";

        return;

    }



    document.getElementById("info").innerHTML = `

        <b>Empresa:</b>
        ${dados.supplier.company_name}
        <br><br>

        <b>Cotação:</b>
        ${dados.quotation.title}
        <br>

        <b>Prazo:</b>
        ${dados.quotation.deadline}

    `;



    produtos = dados.products;



    const tabela =
    document.getElementById("produtos");



    produtos.forEach(produto => {


        tabela.innerHTML += `

        <tr>

            <td>
                ${produto.name}
            </td>


            <td>
                ${produto.quantity} kg
            </td>


            <td>

                <input

                type="number"

                step="0.01"

                id="produto-${produto.id}"

                placeholder="0,00"

                >

            </td>


        </tr>

        `;


    });


}



async function enviarResposta(){


    const respostas = [];



    produtos.forEach(produto => {


        const valor =
        document.getElementById(
            `produto-${produto.id}`
        ).value;



        respostas.push({

            product_id: produto.id,

            price: Number(valor)

        });


    });



    const response = await fetch(

        `/api/supplier-answer/${token}`,

        {

            method:"POST",

            headers:{

                "Content-Type":"application/json"

            },


            body:JSON.stringify({

                answers:respostas,

                observation:
                document.getElementById(
                    "observacao"
                ).value

            })


        }

    );



    const resultado =
    await response.json();



    document.getElementById(
        "mensagem"
    ).innerHTML = resultado.message;


}



carregarCotacao();


</script>


</body>

</html>
