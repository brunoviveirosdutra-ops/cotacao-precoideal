<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Login Administrativo
</title>


<link rel="stylesheet" href="/admin/css/admin.css">


</head>


<body>


<div class="login-box">


<h1>
Cotação Preço Ideal
</h1>


<form id="loginForm">


<input 
type="email"
id="email"
placeholder="Email"
autocomplete="username"
required
>


<input 
type="password"
id="password"
placeholder="Senha"
autocomplete="current-password"
required
>


<button type="submit">
Entrar
</button>


<p id="message"></p>


</form>


</div>


<script src="/admin/js/login.js"></script>


</body>


</html>
