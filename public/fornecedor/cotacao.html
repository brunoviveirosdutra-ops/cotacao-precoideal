<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>Responder Cotação</title>


<style>

body{
    font-family: Arial, sans-serif;
    padding:20px;
}


table{

    width:100%;
    border-collapse:collapse;

}


th,td{

    border:1px solid #ddd;
    padding:10px;

}


input{

    width:120px;
    padding:5px;

}


button{

    margin-top:20px;
    padding:10px 20px;
    background:#198754;
    color:white;
    border:0;
    border-radius:5px;
    cursor:pointer;

}


button:hover{

    opacity:0.9;

}


</style>


</head>


<body>


<h1>Responder Cotação</h1>


<div id="cotacao">

Carregando produtos...

</div>



<button onclick="enviarResposta()">

Enviar resposta

</button>





<script>


const params =
    new URLSearchParams(
        window.location.search
    );


const quoteId =
    params.get("id");





async function carregarProdutos(){


    try{


        const response =
            await fetch(
                `/api/supplier/quotes/${quoteId}/items`,
                {
                    credentials:"include"
                }
            );



        const data =
            await response.json();



        console.log(
            "ITENS RECEBIDOS:",
            data
        );



        const div =
            document.getElementById(
                "cotacao"
            );




        if(!data.success){


            div.innerHTML =
                `
                <p>
                ${data.message}
                </p>
                `;


            return;

        }





        if(!data.items || data.items.length === 0){


            div.innerHTML =
                `
                <p>
                Nenhum produto encontrado.
                </p>
                `;


            return;


        }






        let html = `


        <table>


        <tr>

            <th>Produto</th>

            <th>Quantidade</th>

            <th>Unidade</th>

            <th>Preço</th>

            <th>Observação</th>

        </tr>


        `;






        data.items.forEach(item => {



            html += `


            <tr>



                <td>

                    ${item.product}

                </td>




                <td>

                    ${item.quantity}

                </td>




                <td>

                    ${item.unit}

                </td>




                <td>


                    <input

                    type="number"

                    step="0.01"

                    min="0"

                    class="preco"

                    data-item="${item.id}"

                    >


                </td>






                <td>


                    <input

                    type="text"

                    class="obs"

                    data-item="${item.id}"

                    >


                </td>




            </tr>


            `;



        });





        html += "</table>";



        div.innerHTML =
            html;



    }
    catch(error){


        console.error(
            "ERRO AO CARREGAR PRODUTOS:",
            error
        );


        document.getElementById(
            "cotacao"
        ).innerHTML =
        `
        <p>
        Erro ao carregar produtos.
        </p>
        `;


    }



}








async function enviarResposta(){



    const precos =
        document.querySelectorAll(
            ".preco"
        );



    const observacoes =
        document.querySelectorAll(
            ".obs"
        );




    const respostas = [];





    precos.forEach(input => {



        const itemId =
            input.dataset.item;




        const preco =
            Number(
                input.value
            );





        const obs =
            [...observacoes]
            .find(
                o =>
                o.dataset.item == itemId
            )
            ?.value || "";






        if(preco > 0){


            respostas.push({


                quote_item_id:
                    itemId,


                price:
                    preco,


                observation:
                    obs


            });


        }



    });






    if(respostas.length === 0){


        alert(
            "Informe pelo menos um preço."
        );


        return;


    }






    console.log(
        "RESPOSTAS ENVIADAS:",
        respostas
    );






    try{



        const response =
            await fetch(

                "/api/supplier-answer",

                {


                    method:"POST",


                    headers:{


                        "Content-Type":
                        "application/json"


                    },


                    credentials:"include",



                    body:
                    JSON.stringify({

                        answers:
                            respostas

                    })


                }

            );






        const data =
            await response.json();






        console.log(
            "RETORNO:",
            data
        );






        alert(

            data.message ||
            "Resposta enviada!"

        );






    }
    catch(error){



        console.error(
            "ERRO AO ENVIAR:",
            error
        );


        alert(
            "Erro ao enviar resposta."
        );


    }



}






carregarProdutos();



</script>


</body>

</html>
