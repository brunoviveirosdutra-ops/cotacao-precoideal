<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>Painel Fornecedor</title>


<style>

body{
    font-family: Arial, sans-serif;
    padding:20px;
}


.card{

    border:1px solid #ddd;
    border-radius:8px;
    padding:15px;
    margin-bottom:15px;

}


button{

    background:#0d6efd;
    color:white;
    border:none;
    padding:8px 15px;
    border-radius:5px;
    cursor:pointer;

}


button:hover{

    background:#084298;

}


</style>


</head>


<body>


<h1>Painel do Fornecedor</h1>


<div id="quotesContainer">

    Carregando cotações...

</div>




<script>


async function carregarCotacoes(){


    try{


        const response =
            await fetch(
                "/api/supplier/quotes",
                {
                    method:"GET",
                    credentials:"include"
                }
            );


        const data =
            await response.json();



        console.log(
            "COTAÇÕES:",
            data
        );



        const container =
            document.getElementById(
                "quotesContainer"
            );



        if(!data.success){


            container.innerHTML =
                data.message;


            return;


        }




        if(data.quotes.length === 0){


            container.innerHTML =
                "Nenhuma cotação disponível.";


            return;


        }




        container.innerHTML = "";




        data.quotes.forEach(quote => {



            container.innerHTML +=
            `

            <div class="card">


                <h3>
                    ${quote.title}
                </h3>


                <p>
                    Prazo:
                    ${quote.deadline}
                </p>


                <p>
                    Status:
                    ${quote.status}
                </p>



                <button
                onclick="abrirCotacao(${quote.id})">

                    Responder cotação

                </button>


            </div>


            `;


        });




    }
    catch(error){


        console.error(error);


        document.getElementById(
            "quotesContainer"
        ).innerHTML =
        "Erro ao carregar cotações.";


    }


}




async function abrirCotacao(id){

console.log("CLIQUE RESPONDER", id);
    try{


        await fetch(
            "/api/supplier/quotes/" + id + "/view",
            {
                method:"PUT",
                credentials:"include"
            }
        );


    }
    catch(error){


        console.error(
            "Erro ao marcar visualização:",
            error
        );


    }



    window.location.href =
        "cotacao.html?id=" + id;


}



carregarCotacoes();


</script>



</body>

</html>
